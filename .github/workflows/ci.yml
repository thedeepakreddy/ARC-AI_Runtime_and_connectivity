name: CI

on:
  push:
    branches: [main, 'deepak/**', 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arc
          POSTGRES_PASSWORD: arc
          POSTGRES_DB: arc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arc" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Integration tests create and drop their own databases on this server.
      TEST_DATABASE_URL: postgres://arc:arc@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Inference suite through a real LiteLLM proxy (the version ARC's passthrough is verified on).
  litellm:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arc
          POSTGRES_PASSWORD: arc
          POSTGRES_DB: arc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arc" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://arc:arc@localhost:5432/postgres
      LITELLM_TEST_URL: http://127.0.0.1:4000
      LITELLM_TEST_MASTER_KEY: sk-ci-only-master-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'litellm[proxy]==1.110.0'
      - name: Start LiteLLM
        env:
          LITELLM_MASTER_KEY: sk-ci-only-master-key
        run: |
          litellm --config infra/litellm/config.yaml --port 4000 --num_workers 2 > litellm.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4000/health/liveliness && exit 0; sleep 2; done
          cat litellm.log; exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @arc/api exec vitest run test/inference.test.ts
      - name: Load test and regression gate (ARC overhead p95, error rate)
        working-directory: apps/api
        env:
          LITELLM_URL: http://127.0.0.1:4000
          LITELLM_MASTER_KEY: sk-ci-only-master-key
          BENCH_DATABASE_URL: postgres://arc:arc@localhost:5432/postgres
          BENCH_REDIS_URL: redis://localhost:6379/2
        run: node --import tsx bench/run.ts --gate --requests 300 --concurrency 10 --out bench-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: apps/api/bench-results.json
          if-no-files-found: ignore
      - name: LiteLLM log must not contain provider keys
        run: '! grep -qE "local-provider-key|bench-provider-key" litellm.log'

  # Operations: scripts, alert rules and a real backup → restore → decrypt drill.
  ops:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major as the runner's pg_dump (17+): a dump from a newer pg_dump can contain
        # settings an older server rejects on restore (e.g. SET transaction_timeout).
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arc
          POSTGRES_PASSWORD: arc
          POSTGRES_DB: arc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arc" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/ops/*.sh scripts/ops/tests/*.sh
      - name: Deploy script tests (stubbed docker/git/curl)
        run: scripts/ops/tests/deploy.test.sh
      - name: Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/infra/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v2.55.1 test rules /etc/prometheus/alerts.test.yml
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Restore drill
        env:
          DATABASE_URL: postgres://arc:arc@localhost:5432/arc
          ADMIN_DATABASE_URL: postgres://arc:arc@localhost:5432/postgres
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client gnupg >/dev/null
          pg_dump --version
          psql "$DATABASE_URL" -tAc 'SHOW server_version'
          umask 077
          openssl rand -base64 32 > "$RUNNER_TEMP/backup-pass"
          node apps/api/dist/cli/vault-keygen.js > "$RUNNER_TEMP/vault.json"
          export BACKUP_PASSPHRASE_FILE="$RUNNER_TEMP/backup-pass" ARC_VAULT_KEY_FILE="$RUNNER_TEMP/vault.json"
          node apps/api/dist/cli/migrate.js
          node scripts/ops/tests/seed-drill.mjs
          scripts/ops/restore-drill.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose files
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.smoke.yml --profile monitoring --profile ops config --quiet

  # The real stack, built from this commit: Postgres, Redis, LiteLLM (pinned), API, worker,
  # Prometheus and Alertmanager. Checks inference for two apps with separate keys, scraping, an
  # alert email, then a restore drill through the ops image, and the apps' own ARC smoke tests.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEEP: '1'
    steps:
      # (The runner context is not available in job-level env, so the work dir is set here.)
      - run: echo "SMOKE_WORK_DIR=$RUNNER_TEMP/arc-smoke" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The apps that use ARC (public repos). Their smoke tests run once they ship scripts/arc-smoke.*.
      - uses: actions/checkout@v4
        with: { repository: thedeepakreddy/E.C.H.O-Phone, path: apps-under-test/echo-phone }
      - uses: actions/checkout@v4
        with:
          { repository: thedeepakreddy/DataScienceStudio-AskDeepakAI, path: apps-under-test/dss }
      - name: Install app dependencies
        run: |
          for d in apps-under-test/echo-phone apps-under-test/dss; do
            if ls "$d"/scripts/arc-smoke.* >/dev/null 2>&1; then (cd "$d" && npm ci --no-audit --no-fund); fi
          done
      - name: Full-stack smoke test
        run: |
          [ -f apps-under-test/echo-phone/scripts/arc-smoke.mjs ] && export ECHO_DIR="$PWD/apps-under-test/echo-phone"
          [ -f apps-under-test/dss/scripts/arc-smoke.ts ] && export DSS_DIR="$PWD/apps-under-test/dss"
          scripts/ops/stack-smoke.sh
      - name: Backup and restore drill through the ops image
        run: |
          W="$SMOKE_WORK_DIR"
          openssl rand -base64 32 > "$W/secrets/backup-passphrase"
          chmod 644 "$W/secrets/backup-passphrase"
          docker compose -p arc-smoke --env-file "$W/.env" -f docker-compose.yml -f docker-compose.smoke.yml \
            --profile ops run --rm -T ops scripts/ops/backup.sh
          ARC_ENV_FILE="$W/.env" ARC_COMPOSE_PROJECT=arc-smoke ARC_COMPOSE_EXTRA=docker-compose.smoke.yml \
            ARC_SECRETS_DIR="$W/secrets" scripts/ops/vps-verify.sh --drill-only
      - name: Logs on failure
        if: failure()
        run: docker compose -p arc-smoke --env-file "$SMOKE_WORK_DIR/.env" -f docker-compose.yml -f docker-compose.smoke.yml --profile monitoring logs --tail 80
      - name: Tear down
        if: always()
        run: docker compose -p arc-smoke --env-file "$SMOKE_WORK_DIR/.env" -f docker-compose.yml -f docker-compose.smoke.yml --profile monitoring --profile ops down -v || true
