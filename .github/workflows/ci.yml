name: CI

on:
  push:
    branches: [main, 'deepak/**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arc
          POSTGRES_PASSWORD: arc
          POSTGRES_DB: arc
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arc" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Integration tests create and drop their own databases on this server.
      TEST_DATABASE_URL: postgres://arc:arc@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose files
        run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.dev.yml config --quiet
