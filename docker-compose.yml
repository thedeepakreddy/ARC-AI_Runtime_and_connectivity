name: arc

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-arc}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/10-litellm-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  litellm:
    <<: *restart
    # Pinned by digest to the release ARC's passthrough is verified against (1.110.0). The same
    # digest is published as ghcr.io/berriai/litellm:v1.110.0. Re-run the inference suite and the
    # load-test gate before moving to a newer release.
    image: litellm/litellm:v1.110.0@sha256:4295b064b22eb88f9530e616afc812edd47048891ba64896bfc3fa74e2b883c3
    # Worker count sized by load testing (see docs/adr/0008-operations.md).
    command:
      [
        '--config',
        '/app/config.yaml',
        '--port',
        '4000',
        '--num_workers',
        '${LITELLM_NUM_WORKERS:-4}',
      ]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # backend: reachable by ARC only. egress: outbound internet to model providers.
    networks: [backend, egress]

  api:
    <<: *restart
    # Tagged per commit by scripts/ops/deploy.sh; "local" for ad-hoc builds.
    image: arc-api:${ARC_VERSION:-local}
    build: { context: ., target: api }
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arc}
      REDIS_URL: redis://redis:6379
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      # Vault keys live outside Postgres, mounted read-only. See docs/operations.md.
      ARC_VAULT_KEY_FILE: /run/secrets/arc/vault-keys.json
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Customer sign-up: invite (default) or open.
      SIGNUP_MODE: ${SIGNUP_MODE:-invite}
      # Metrics on 9464, reachable only on the private backend network (not published).
      METRICS_PORT: 9464
      # Firing alerts in the console's "Needs you" list (monitoring profile).
      ALERTMANAGER_URL: http://alertmanager:9093
    volumes:
      - ${ARC_SECRETS_DIR:-./secrets}:/run/secrets/arc:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      litellm: { condition: service_healthy }
    networks: [backend, edge]
    # Loopback only by default: Caddy (--profile https) is the public entry. Set ARC_HTTP_BIND=0.0.0.0
    # only to expose plain HTTP on purpose (e.g. behind another proxy on another host).
    ports: ['${ARC_HTTP_BIND:-127.0.0.1}:${ARC_HTTP_PORT:-8080}:8080']

  worker:
    <<: *restart
    image: arc-worker:${ARC_VERSION:-local}
    build: { context: ., target: worker }
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arc}
      ARC_VAULT_KEY_FILE: /run/secrets/arc/vault-keys.json
    volumes:
      - ${ARC_SECRETS_DIR:-./secrets}:/run/secrets/arc:ro
    depends_on:
      postgres: { condition: service_healthy }
    # egress: the worker probes provider keys for health and model discovery.
    networks: [backend, egress]

  # Optional monitoring: docker compose --profile monitoring up -d
  prometheus:
    <<: *restart
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=15d']
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    # backend: scrapes ARC. admin: lets the loopback-only UI port work (Docker publishes no
    # ports for a container that is only on an internal network).
    networks: [backend, admin]
    # UI on the host loopback only.
    ports: ['127.0.0.1:9090:9090']

  # Sends ARC's alerts by email. Settings come from .env (ALERT_*); the SMTP password is read
  # from ${ARC_SECRETS_DIR}/smtp-password. See docs/operations.md → Alerts by email.
  alertmanager:
    <<: *restart
    profiles: [monitoring]
    image: prom/alertmanager:v0.28.1
    entrypoint: ['/bin/sh', '/etc/alertmanager/start.sh']
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-smtp.gmail.com:587}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_REQUIRE_TLS: ${ALERT_SMTP_REQUIRE_TLS:-true}
    volumes:
      - ./infra/alertmanager:/etc/alertmanager:ro
      - ${ARC_SECRETS_DIR:-./secrets}:/run/secrets/arc:ro
      - amdata:/alertmanager
    # backend: Prometheus reaches it. egress: it reaches your SMTP server.
    networks: [backend, egress]
    ports: ['127.0.0.1:9093:9093']

  # Operations (not started by `up`): docker compose --profile ops run --rm ops scripts/ops/…
  # See docs/operations.md → Backups and restore, and scripts/ops/vps-verify.sh.
  ops:
    profiles: [ops]
    image: arc-ops:${ARC_VERSION:-local}
    build: { context: ., target: ops }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-arc}
      ADMIN_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres
      ARC_VAULT_KEY_FILE: /run/secrets/arc/vault-keys.json
      BACKUP_PASSPHRASE_FILE: /run/secrets/arc/backup-passphrase
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Off-site copy, e.g. "oci:arc-backups" (rclone config in ${ARC_SECRETS_DIR}/rclone.conf).
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      RCLONE_CONFIG: /run/secrets/arc/rclone.conf
    volumes:
      - ${ARC_SECRETS_DIR:-./secrets}:/run/secrets/arc:ro
      - ${ARC_BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }
    # backend: the database. egress: the off-site backup target.
    networks: [backend, egress]

  bench:
    profiles: [ops]
    image: arc-bench:${ARC_VERSION:-local}
    build: { context: ., target: bench }
    environment:
      LITELLM_URL: http://127.0.0.1:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in .env}
      BENCH_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres
      BENCH_REDIS_URL: redis://redis:6379/2
    volumes:
      - ${ARC_REPORT_DIR:-./ops-reports}:/reports
    # Shares LiteLLM's network stack: LiteLLM reaches the benchmark's mock providers on 127.0.0.1.
    network_mode: service:litellm
    depends_on:
      litellm: { condition: service_healthy }

  # HTTPS for the public: certificates from Let's Encrypt, renewed automatically.
  caddy:
    profiles: [https]
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      ARC_DOMAIN: ${ARC_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    # Checked here, not with ${VAR:?}: compose would demand them even without this profile.
    command:
      - sh
      - -c
      - >-
        [ -n "$$ARC_DOMAIN" ] && [ -n "$$ACME_EMAIL" ] ||
        { echo 'Set ARC_DOMAIN and ACME_EMAIL in .env' >&2; exit 1; };
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }

networks:
  # Internal network: Postgres, Redis and LiteLLM are not reachable from outside.
  backend: { internal: true }
  # Public entry to the ARC API only.
  edge: {}
  # Outbound internet for services that call model providers (LiteLLM, worker).
  egress: {}
  # Loopback-only admin UIs (Prometheus).
  admin: {}

volumes:
  amdata:
  caddydata:
  caddyconfig:
  promdata:
  pgdata:
  redisdata:
