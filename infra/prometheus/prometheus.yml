global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Alerts go to Alertmanager, which emails them (infra/alertmanager).
alerting:
  alertmanagers:
    - static_configs: [{ targets: ['alertmanager:9093'] }]

scrape_configs:
  - job_name: arc-api
    static_configs: [{ targets: ['api:9464'] }]
  - job_name: arc-worker
    static_configs: [{ targets: ['worker:9465'] }]
