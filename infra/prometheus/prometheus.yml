global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Wire an Alertmanager (email, Slack, PagerDuty …) here once a destination is chosen:
# alerting:
#   alertmanagers:
#     - static_configs: [{ targets: ['alertmanager:9093'] }]

scrape_configs:
  - job_name: arc-api
    static_configs: [{ targets: ['api:9464'] }]
  - job_name: arc-worker
    static_configs: [{ targets: ['worker:9465'] }]
