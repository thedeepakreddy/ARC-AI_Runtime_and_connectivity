# Local development override: expose backing services on localhost only,
# so `pnpm dev` on the host can reach them.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up postgres redis litellm
services:
  postgres:
    networks: [backend, edge]
    ports: ['127.0.0.1:5432:5432']
  redis:
    networks: [backend, edge]
    ports: ['127.0.0.1:6379:6379']
  litellm:
    networks: [backend, edge]
    ports: ['127.0.0.1:4000:4000']
